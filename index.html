<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مزاد ابراهيم الباشا | أقرب فرع</title>

<style>

body{
  margin:0;
  font-family:Arial;
  background:white;
  text-align:center;
}

/* اللوجو */
.logo{
  width:140px;
  margin-top:20px;
}

/* الكارد */
.card{
  background:#1f2937;
  color:white;
  margin:20px;
  padding:25px;
  border-radius:20px;
  box-shadow:0 4px 10px rgba(0,0,0,0.3);
}

/* الزر الرئيسي */
button{
  width:90%;
  padding:15px;
  font-size:18px;
  background:#ff6a00;
  border:none;
  border-radius:12px;
  color:white;
  margin-top:20px;
  cursor:pointer;
}

/* الأزرار */
.btn{
  display:block;
  width:90%;
  margin:10px auto;
  padding:14px;
  border-radius:12px;
  text-decoration:none;
  color:white;
  font-size:16px;
  font-weight:bold;
}

/* Google Maps */
.maps{
  background:#374151;
}

/* Waze */
.waze{
  background:#33ccff;
}

/* Footer */
footer{
  margin-top:40px;
  padding:20px;
  font-size:14px;
  color:#6b7280;
  text-align:center;
}

</style>
</head>

<body>

<!-- اللوجو -->
<img src="./logo.png" class="logo">

<!-- كارد الموقع -->
<div class="card" id="locationCard">

<h3>حدد موقعك حتى نوجهك لأقرب فرع عليك 📍</h3>

<button onclick="findNearest()">
📍 تحديد موقعي
</button>

</div>

<!-- النتائج -->
<div id="result"></div>

<script>

const branches = [

{name:"المكتب الرئيسي بغداد ", lat:33.54599575074458, lng:44.392682788903535},
{name:"الباشا فرع البصرة", lat:30.4899722055262, lng:47.81148843130929},
{name:"الباشا فرع بابل", lat:32.500383598402436, lng:44.418602002424485},
{name:"الباشا فرع كربلاء", lat:32.60975649461941, lng:44.01063895824518},
{name:"الحسام فرع الحلة", lat:32.48641839971165, lng:44.39936753136022}

];

function distance(a,b,c,d){
  return Math.sqrt((a-c)**2 + (b-d)**2);
}

function openWaze(lat,lng){

  window.location = `waze://?ll=${lat},${lng}&navigate=yes`;

  setTimeout(function(){

    window.location =
    `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;

  },1500);

}

function findNearest(){

  if(!navigator.geolocation){

    alert("جهازك لا يدعم الموقع");
    return;

  }

  navigator.geolocation.getCurrentPosition(function(pos){

    let lat = pos.coords.latitude;
    let lng = pos.coords.longitude;

    let sorted = branches.map(function(branch){

      return {
        ...branch,
        dist:(distance(lat,lng,branch.lat,branch.lng)*111).toFixed(1)
      };

    });

    sorted.sort(function(a,b){
      return a.dist - b.dist;
    });

    let nearestThree = sorted.slice(0,3);

    let html = "";

    nearestThree.forEach(function(branch,index){

      let badge = "";

      if(index === 0){

        badge = `
        <div style="
        background:#ff6a00;
        color:white;
        padding:8px;
        border-radius:10px;
        margin-bottom:10px;
        font-size:14px;
        font-weight:bold;
        ">
        📍 الأقرب إليك
        </div>
        `;

      }

      html += `

      <div class="card">

      ${badge}

      <h2>${branch.name}</h2>

      <p style="opacity:0.8;">
      📍 يبعد عنك ${branch.dist} كم
      </p>

      <a class="btn maps" target="_blank"
      href="https://www.google.com/maps/dir/?api=1&destination=${branch.lat},${branch.lng}">
      🚗 Google Maps
      </a>

      <a class="btn waze"
      onclick="openWaze(${branch.lat},${branch.lng})">
      🧭 فتح Waze
      </a>

      </div>

      `;

    });

    document.getElementById("result").innerHTML = html;

    /* اخفاء كارد الموقع */
    document.getElementById("locationCard").style.display = "none";

  }, function(){

    alert("فعل الموقع من المتصفح");

  });

}

</script>

<footer>
Powered by <b>SHASSIHA</b> © 2026
</footer>

</body>
</html>
