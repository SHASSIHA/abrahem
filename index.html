<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شركة الباشا | أقرب فرع</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:
linear-gradient(
180deg,
#ffffff 0%,
#f7f8fb 40%,
#eef2f7 100%
);
color:#222;
text-align:center;
}

/* الهيدر الثابت */

.header{
position:sticky;
top:0;
z-index:999;
background:white;
}

/* منطقة اللوكو */

.logo-wrapper{
background:white;
padding:15px 0 40px;
position:relative;
}

.logo-wrapper::after{
content:"";
position:absolute;
left:0;
bottom:0;
width:100%;
height:70px;

background:linear-gradient(
to bottom,
rgba(255,255,255,0),
#f4f6f9
);
}

.logo{
width:340px;
max-width:95%;
display:block;
margin:auto;

filter:
drop-shadow(0 10px 20px rgba(0,0,0,.08));
}

/* المحتوى */

.container{
padding:20px 10px;
}

/* الكارد */

.card{
background:white;
margin:15px auto;
padding:25px;
border-radius:22px;
width:min(950px,95%);
box-shadow:0 5px 18px rgba(0,0,0,.08);
}

/* المكتب الرئيسي */

.main-office{
border:3px solid #1f3b73;
box-shadow:0 8px 25px rgba(31,59,115,.18);
}

h2{
margin-bottom:10px;
}

button{
width:100%;
padding:18px;
font-size:20px;
font-weight:bold;
border:none;
border-radius:14px;
cursor:pointer;
background:#1f3b73;
color:white;
transition:.3s;
}

button:hover{
background:#294d93;
}

.btn{
display:block;
width:100%;
padding:14px;
margin-top:10px;
border-radius:12px;
text-decoration:none;
font-weight:bold;
color:white;
}

.maps{
background:#1f3b73;
}

.waze{
background:#33ccff;
}

.badge{
display:inline-block;
padding:8px 14px;
border-radius:10px;
margin-bottom:10px;
font-size:14px;
font-weight:bold;
color:white;
}

.main-badge{
background:#1f3b73;
}

.nearest{
background:#d62828;
}

.distance{
margin:12px 0;
font-size:17px;
color:#666;
}

footer{
padding:25px;
font-size:14px;
color:#777;
}

</style>
</head>

<body>

<div class="header">

<div class="logo-wrapper">
<img src="./logo.png" class="logo">
</div>

</div>

<div class="container">

<div class="card" id="locationCard">

<h2>📍 حدد موقعك حتى نوجهك لأقرب فرع عليك</h2>

<br>

<button onclick="findNearest()">
📍 تحديد موقعي
</button>

</div>

<div id="result"></div>

</div>

<script>

const branches = [

{
name:"المكتب الرئيسي بغداد",
lat:33.54599575074458,
lng:44.392682788903535,
isMain:true
},

{
name:"الباشا فرع البصرة",
lat:30.4899722055262,
lng:47.81148843130929
},

{
name:"الباشا فرع بابل",
lat:32.500383598402436,
lng:44.418602002424485
},

  {
name:"الباشا فرع النجف",
lat:32.00843104504022,
lng:44.35886288709582
},
{
name:"الباشا فرع كربلاء",
lat:32.60975649461941,
lng:44.01063895824518
}

];

function distance(a,b,c,d){
return Math.sqrt((a-c)**2 + (b-d)**2);
}

function openWaze(lat,lng){

window.location=`waze://?ll=${lat},${lng}&navigate=yes`;

setTimeout(function(){

window.location=
`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;

},1500);

}

function findNearest(){

if(!navigator.geolocation){

alert("جهازك لا يدعم الموقع");
return;

}

navigator.geolocation.getCurrentPosition(function(pos){

let lat=pos.coords.latitude;
let lng=pos.coords.longitude;

let sorted=branches.map(function(branch){

return{

...branch,

dist:(distance(
lat,
lng,
branch.lat,
branch.lng
)*111).toFixed(1)

};

});

sorted.sort(function(a,b){

return a.dist-b.dist;

});

let nearestBranch=sorted[0];

let mainOffice=sorted.find(x=>x.isMain);

let otherBranches=sorted.filter(x=>!x.isMain);

let finalList=[mainOffice,...otherBranches];

let html="";

finalList.forEach(function(branch){

let badges="";

if(branch.isMain){

badges+=`
<div class="badge main-badge">
🏢 المكتب الرئيسي
</div><br>
`;

}

if(branch.name===nearestBranch.name){

badges+=`
<div class="badge nearest">
📍 أقرب فرع إليك
</div>
`;

}

html+=`

<div class="card ${branch.isMain ? 'main-office' : ''}">

${badges}

<h2>${branch.name}</h2>

<p class="distance">
يبعد عنك ${branch.dist} كم
</p>

<a
class="btn maps"
target="_blank"
href="https://www.google.com/maps/dir/?api=1&destination=${branch.lat},${branch.lng}">
🚗 Google Maps
</a>

<a
class="btn waze"
onclick="openWaze(${branch.lat},${branch.lng})">
🧭 فتح Waze
</a>

</div>

`;

});

document.getElementById("result").innerHTML=html;

document.getElementById("locationCard").style.display="none";

},

function(){

alert("يرجى تفعيل الموقع من المتصفح");

});

}

</script>

<footer>
Powered by <b>SHASSIHA</b> © 2026
</footer>

</body>
</html>
