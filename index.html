<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مزاد ابراهيم الباشا | أقرب فرع</title>

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f8f8f8;
  text-align:center;
  color:#222;
}

/* اللوجو */
.logo{
  width:220px;
  max-width:90%;
  margin-top:25px;
}

/* الكارد */
.card{
  background:white;
  color:#222;
  margin:15px;
  padding:25px;
  border-radius:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

/* المكتب الرئيسي */
.main-office{
  border:3px solid #c9a227;
  box-shadow:0 6px 20px rgba(201,162,39,.25);
}

/* الزر الرئيسي */
button{
  width:90%;
  padding:15px;
  font-size:18px;
  background:#c9a227;
  border:none;
  border-radius:12px;
  color:white;
  margin-top:20px;
  cursor:pointer;
  font-weight:bold;
}

/* الأزرار */
.btn{
  display:block;
  width:90%;
  margin:10px auto;
  padding:14px;
  border-radius:12px;
  text-decoration:none;
  color:white;
  font-size:16px;
  font-weight:bold;
}

/* Google Maps */
.maps{
  background:#1f2937;
}

/* Waze */
.waze{
  background:#33ccff;
}

.badge{
  background:#c9a227;
  color:white;
  padding:8px 12px;
  border-radius:10px;
  display:inline-block;
  margin-bottom:10px;
  font-size:14px;
  font-weight:bold;
}

.nearest{
  background:#ff6a00;
}

footer{
  margin-top:40px;
  padding:20px;
  font-size:14px;
  color:#777;
}

</style>
</head>

<body>

<img src="./logo.png" class="logo">

<div class="card" id="locationCard">

<h2>حدد موقعك حتى نوجهك لأقرب فرع عليك 📍</h2>

<button onclick="findNearest()">
📍 تحديد موقعي
</button>

</div>

<div id="result"></div>

<script>

const branches = [

{name:"المكتب الرئيسي بغداد",lat:33.54599575074458,lng:44.392682788903535,isMain:true},

{name:"الباشا فرع البصرة",lat:30.4899722055262,lng:47.81148843130929},

{name:"الباشا فرع بابل",lat:32.500383598402436,lng:44.418602002424485},

{name:"الباشا فرع كربلاء",lat:32.60975649461941,lng:44.01063895824518}

];

function distance(a,b,c,d){
 return Math.sqrt((a-c)**2 + (b-d)**2);
}

function openWaze(lat,lng){

 window.location=`waze://?ll=${lat},${lng}&navigate=yes`;

 setTimeout(function(){

   window.location=
   `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;

 },1500);

}

function findNearest(){

 if(!navigator.geolocation){
   alert("جهازك لا يدعم الموقع");
   return;
 }

 navigator.geolocation.getCurrentPosition(function(pos){

   let lat=pos.coords.latitude;
   let lng=pos.coords.longitude;

   let sorted=branches.map(function(branch){

     return{
       ...branch,
       dist:(distance(lat,lng,branch.lat,branch.lng)*111).toFixed(1)
     };

   });

   sorted.sort(function(a,b){
     return a.dist-b.dist;
   });

   let nearestBranch = sorted[0];

   let mainOffice = sorted.find(x => x.isMain);
   let otherBranches = sorted.filter(x => !x.isMain);

   let finalList = [mainOffice,...otherBranches];

   let html="";

   finalList.forEach(function(branch){

     let badges="";

     if(branch.isMain){
       badges += `<div class="badge">🏢 المكتب الرئيسي</div><br>`;
     }

     if(branch.name === nearestBranch.name){
       badges += `<div class="badge nearest">📍 أقرب فرع إليك</div>`;
     }

     html += `

     <div class="card ${branch.isMain ? 'main-office' : ''}">

       ${badges}

       <h2>${branch.name}</h2>

       <p>
       📍 يبعد عنك ${branch.dist} كم
       </p>

       <a class="btn maps"
       target="_blank"
       href="https://www.google.com/maps/dir/?api=1&destination=${branch.lat},${branch.lng}">
       🚗 Google Maps
       </a>

       <a class="btn waze"
       onclick="openWaze(${branch.lat},${branch.lng})">
       🧭 فتح Waze
       </a>

     </div>

     `;

   });

   document.getElementById("result").innerHTML=html;

   document.getElementById("locationCard").style.display="none";

 },function(){

   alert("فعل الموقع من المتصفح");

 });

}

</script>

<footer>
Powered by <b>SHASSIHA</b> © 2026
</footer>

</body>
</html>
